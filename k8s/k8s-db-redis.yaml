# Указываем версию API для создания контроллеров развертывания приложений
apiVersion: apps/v1
# Определяем тип создаваемого объекта как Deployment для запуска базы данных PostgreSQL
kind: Deployment
# Секция метаданных для идентификации развертывания
metadata:
  # Задаем уникальное имя развертывания СУБД в кластере
  name: db
# Техническая спецификация желаемого состояния развертывания
spec:
  # Количество одновременно запущенных идентичных реплик (подов) базы данных
  replicas: 1
  # Селектор для связывания развертывания с управляемыми подами
  selector:
    # Шаблон сопоставления меток для поиска нужных подов
    matchLabels:
      # Поды с этой меткой будут управляться данным развертыванием db
      app: db
  # Шаблон создания новых подов при их отсутствии или сбоях
  template:
    # Метаданные создаваемых подов СУБД
    metadata:
      # Метки, навешиваемые на создаваемый под
      labels:
        # Метка приложения, идентифицирующая под базы данных
        app: db
    # Спецификация конфигурации контейнеров внутри пода базы данных
    spec:
      # Список запускаемых контейнеров внутри пода (в нашем случае один)
      containers:
        # Имя контейнера внутри пода
        - name: postgres
          # Официальный образ PostgreSQL версии 18
          image: postgres:18
          # Список переменных окружения для инициализации базы данных
          env:
            # Переменная пути хранения данных СУБД внутри контейнера
            - name: PGDATA
              # Каталог во внутреннем томе контейнера
              value: /var/lib/postgresql/data/pgdata
            # Имя администратора СУБД, считываемое из секретов кластера
            - name: POSTGRES_USER
              # Источник значения переменной
              valueFrom:
                # Ссылка на объект секрета
                secretKeyRef:
                  # Имя секретного объекта, созданного в k8s-config.yaml
                  name: postgres-credentials
                  # Ключ внутри секрета, значение которого нужно извлечь
                  key: POSTGRES_USER
            # Пароль администратора, считываемый из секретов кластера
            - name: POSTGRES_PASSWORD
              # Источник значения переменной
              valueFrom:
                # Ссылка на объект секрета
                secretKeyRef:
                  # Имя секретного объекта с паролями
                  name: postgres-credentials
                  # Ключ внутри секрета, значение которого нужно извлечь
                  key: POSTGRES_PASSWORD
            # Имя базы данных, считываемое из секретов кластера
            - name: POSTGRES_DB
              # Источник значения переменной
              valueFrom:
                # Ссылка на объект секрета
                secretKeyRef:
                  # Имя секретного объекта с названием БД
                  name: postgres-credentials
                  # Ключ внутри секрета, значение которого нужно извлечь
                  key: POSTGRES_DB
          # Описание монтирования внешних дисков и конфигураций в контейнер
          volumeMounts:
            # Монтирование скрипта инициализации структуры таблиц БД
            - name: init-script-volume
              # Путь монтирования внутри контейнера PostgreSQL
              mountPath: /docker-entrypoint-initdb.d/init.sql
              # Имя ключа из ConfigMap, который монтируем как файл
              subPath: init.sql
          # Список сетевых портов, открываемых контейнером
          ports:
            # Описание порта базы данных
            - containerPort: 5432
              # Имя порта для сетевой адресации внутри кластера
              name: dbport
      # Описание виртуальных томов, подключаемых к поду СУБД
      volumes:
        # Объявление тома на основе ранее созданной карты ConfigMap
        - name: init-script-volume
          # Источник данных для тома
          configMap:
            # Имя ConfigMap, содержащего скрипт init.sql
            name: postgres-init-script

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Версия API Kubernetes для базовых сетевых сервисов
apiVersion: v1
# Определяем тип создаваемого объекта как Service для организации сетевого доступа к БД
kind: Service
# Метаданные сетевой службы базы данных
metadata:
  # Уникальное внутреннее DNS-имя службы, по которому бэкенд будет обращаться к БД (db:5432)
  name: db
# Спецификация конфигурации сетевого сервиса базы данных
spec:
  # Порты, прослушиваемые службой
  ports:
    # Описание порта сетевой службы
    - port: 5432
      # Целевой порт в контейнере пода, на который перенаправляется трафик
      targetPort: 5432
  # Селектор для определения подов, к которым служба будет направлять трафик
  selector:
    # Служба будет перенаправлять запросы на поды с меткой app: db
    app: db
  # Тип сервиса по умолчанию ClusterIP (доступен только внутри виртуальной сети кластера)
  type: ClusterIP

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Указываем версию API для создания контроллеров развертывания
apiVersion: apps/v1
# Определяем тип создаваемого объекта как Deployment для запуска кэш-сервера Redis
kind: Deployment
# Метаданные развертывания кэш-сервера
metadata:
  # Имя развертывания Redis в кластере
  name: redis
# Спецификация желаемого состояния развертывания Redis
spec:
  # Количество одновременно запущенных подов Redis
  replicas: 1
  # Селектор для связывания развертывания с управляемыми подами
  selector:
    # Шаблон поиска подов по меткам
    matchLabels:
      # Поды с меткой app: redis будут управляться данным развертыванием
      app: redis
  # Шаблон создания подов Redis
  template:
    # Метаданные создаваемых подов Redis
    metadata:
      # Список меток пода
      labels:
        # Метка приложения, идентифицирующая под кэш-сервера
        app: redis
    # Спецификация конфигурации контейнеров внутри пода Redis
    spec:
      # Список запускаемых контейнеров (один контейнер Redis)
      containers:
        # Имя контейнера внутри пода
        - name: redis
          # Использование официального образа Redis версии 8
          image: redis:8
          # Список сетевых портов, открываемых контейнером Redis
          ports:
            # Описание стандартного порта Redis
            - containerPort: 6379
              # Внутреннее имя порта в поде
              name: redisport

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Версия API Kubernetes для базовых сетевых сервисов
apiVersion: v1
# Определяем тип создаваемого объекта как Service для организации сетевого доступа к Redis
kind: Service
# Метаданные сетевой службы Redis
metadata:
  # Уникальное внутреннее DNS-имя службы, по которому бэкенд будет обращаться к кэшу (redis:6379)
  name: redis
# Спецификация конфигурации сетевого сервиса Redis
spec:
  # Список портов службы
  ports:
    # Описание порта сетевой службы
    - port: 6379
      # Целевой порт в контейнере Redis, на который направляется трафик
      targetPort: 6379
  # Селектор для перенаправления сетевого трафика на нужные поды
  selector:
    # Направлять запросы на поды с меткой app: redis
    app: redis
  # Внутренний тип сетевой службы кластера
  type: ClusterIP