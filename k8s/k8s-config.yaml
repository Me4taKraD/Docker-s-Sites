# Указываем версию API Kubernetes для создания базовых объектов конфигурации
apiVersion: v1
# Определяем тип создаваемого объекта как Secret для хранения секретных данных
kind: Secret
# Секция метаданных для идентификации объекта в пространстве имён
metadata:
  # Задание уникального имени объекта секретов базы данных
  name: postgres-credentials
# Тип секрета, определяющий способ обработки данных (Opaque - произвольные данные)
type: Opaque
# Словарь зашифрованных в Base64 ключевых параметров базы данных
data:
  # Имя пользователя СУБД (значение "postgres_user" в Base64)
  POSTGRES_USER: cG9zdGdyZXNfdXNlcg==
  # Пароль администратора базы данных (значение "postgres_password" в Base64)
  POSTGRES_PASSWORD: cG9zdGdyZXNfcGFzc3dvcmQ=
  # Имя создаваемой по умолчанию базы данных (значение "main_application_db" в Base64)
  POSTGRES_DB: bWFpbl9hcHBsaWNhdGlvbl9kYg==

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Указываем версию API Kubernetes для создания базовых объектов конфигурации
apiVersion: v1
# Определяем тип создаваемого объекта как Secret для хранения SSL/TLS сертификатов
kind: Secret
# Секция метаданных для идентификации TLS секрета
metadata:
  # Уникальное имя секрета для монтирования в прокси-сервер Nginx
  name: nginx-tls-certs
# Специализированный тип секрета Kubernetes для хранения закрытых ключей и сертификатов
type: kubernetes.io/tls
# Словарь с закодированными файлами сертификата и ключа
data:
  # Весь файл selfsigned.crt, закодированный в Base64
  tls.crt: 
  # Весь файл selfsigned.key, закодированный в Base64
  tls.key: 

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Указываем версию API Kubernetes для создания базовых объектов конфигурации
apiVersion: v1
# Определяем тип создаваемого объекта как ConfigMap для хранения неконфиденциальных данных
kind: ConfigMap
# Секция метаданных для идентификации конфигурационной карты
metadata:
  # Задание уникального имени объекта карты для инициализации базы данных
  name: postgres-init-script
# Словарь, в котором будут храниться файлы конфигурации и скрипты
data:
  # Название создаваемого виртуального файла внутри тома
  init.sql: |
    -- Создаем структуру таблицы товаров, если СУБД запускается впервые
    CREATE TABLE IF NOT EXISTS items (
    -- Первичный ключ с автоинкрементом
    id SERIAL PRIMARY KEY,
    -- Поле названия игры
    title TEXT NOT NULL,
    -- Поле подробного описания
    description TEXT,
    -- Относительный путь к файлу обложки
    image_url VARCHAR(255),
    -- JSONB поле для расширенных параметров товара
    characteristics JSONB DEFAULT '{}'
    );

    -- Добавляем начальный игровой товар в каталог
    INSERT INTO items (title, description, image_url)
    VALUES (
      -- Название игры
      'SPRAWL zero',
      -- Описание игры
      'Динамичный шутер, вдохновленный культовыми играми этого жанра 2000-х годов. Попробуйте выжить в жестоком киберпанковском городе, угнетаемом военным режимом и религиозными фанатиками.',
      -- Корректный путь к изображению с префиксом /static для раздачи шлюзом
      '/static/images/capsule_231x87_2x.jpg'
    ) ON CONFLICT DO NOTHING;

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Указываем версию API Kubernetes для создания базовых объектов конфигурации
apiVersion: v1
# Определяем тип создаваемого объекта как ConfigMap для хранения конфигурации Nginx
kind: ConfigMap
# Секция метаданных для идентификации конфигурационной карты шлюза
metadata:
  # Задание уникального имени объекта карты для конфигурации Nginx
  name: nginx-configuration
# Хранилище текстовых файлов конфигурации
data:
  # Название виртуального файла конфигурации, который будет смонтирован в контейнер
  nginx.conf: |
    # Задаем область обработки событий сетевых соединений в Nginx
    events {
      # Устанавливаем предельное количество одновременно обслуживаемых соединений одним рабочим процессом
      worker_connections 1024;
    }

    # Открываем главный блок настройки HTTP протокола
    http {
      # Включаем автоматическое определение MIME-типов передаваемых файлов
      include /etc/nginx/mime.types;
      # Задаем базовый тип содержимого по умолчанию для неизвестных файлов
      default_type application/octet-stream;
      
      # Настраиваем виртуальный сервер для перенаправления HTTP на HTTPS
      server {
        # Слушаем входящие запросы на стандартном порту 80
        listen 80;
        # Задаем доменное имя локального узла
        server_name localhost;

        # Устанавливаем правила обработки для всех входящих путей
        location / {
          # Перенаправляем на защищенный протокол HTTPS с кодом 301
          return 301 https://$host$request_uri;
        }
      }

      # Настраиваем виртуальный сервер для обработки защищенного TLS-трафика
      server {
        # Активируем прослушивание порта 443 с поддержкой SSL/TLS шифрования
        listen 443 ssl;
        # Задаем доменное имя локального узла для защищенного соединения
        server_name localhost;

        # Путь к файлу публичного сертификата внутри контейнера Nginx (из смонтированного секрета)
        ssl_certificate /etc/nginx/certs/tls.crt;
        # Путь к файлу закрытого ключа внутри контейнера Nginx (из смонтированного секрета)
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # Разрешенные безопасные версии криптографических протоколов соединения
        ssl_protocols TLSv1.2 TLSv1.3;

        # Настраиваем перенаправление запросов API на бэкенд FastAPI
        location /api/ {
          # Проксируем входящие запросы на внутренний Kubernetes Service "backend" на порту 8000
          proxy_pass http://backend:8000/;
          # Запись оригинального сетевого имени узла в заголовок проксирования
          proxy_set_header Host $host;
          # Передача реального сетевого адреса клиента в заголовок проксирования
          proxy_set_header X-Real-IP $remote_addr;
          # Формируем список промежуточных IP-адресов в заголовке X-Forwarded-For
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          # Передаем исходную схему соединения во внутреннем заголовке X-Forwarded-Proto
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Перенаправляем запросы статики на бэкенд FastAPI, где внутри образа хранятся картинки
        location /static/ {
          # Проксируем трафик статики на внутренний Service backend
          proxy_pass http://backend:8000/static/;
          # Передаем оригинальный заголовок Host
          proxy_set_header Host $host;
        }

        # Настраиваем перенаправление всех остальных запросов на клиентское приложение React
        location / {
          # Проксируем трафик на внутренний Kubernetes Service "frontend" на порту 80
          proxy_pass http://frontend:80;
          # Сохраняем и передаем оригинальный заголовок Host от клиента
          proxy_set_header Host $host;
          # Передаем реальный IP-адрес клиента во внутреннем заголовке X-Real-IP
          proxy_set_header X-Real-IP $remote_addr;
          # Формируем список промежуточных IP-адресов в заголовке X-Forwarded-For
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          # Передаем исходную схему соединения во внутреннем заголовке X-Forwarded-Proto
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }   
    }