# Указываем версию API для создания контроллеров развертывания приложений
apiVersion: apps/v1
# Определяем тип создаваемого объекта как Deployment для запуска FastAPI бэкенда
kind: Deployment
# Метаданные развертывания бэкенда
metadata:
  # Имя развертывания бэкенда в кластере
  name: backend
# Спецификация желаемого состояния развертывания бэкенда
spec:
  # Количество одновременно запущенных реплик (подов) бэкенда
  replicas: 1
  # Селектор для привязки развертывания к подам бэкенда
  selector:
    # Шаблон поиска подов по меткам
    matchLabels:
      # Поды с меткой app: backend будут управляться этим деплойментом
      app: backend
  # Шаблон создания подов бэкенда
  template:
    # Метаданные создаваемых подов
    metadata:
      # Список меток пода бэкенда
      labels:
        # Метка приложения, идентифицирующая под бэкенда
        app: backend
    # Спецификация контейнеров внутри пода бэкенда
    spec:
      # Список запускаемых контейнеров
      containers:
        # Имя контейнера внутри пода
        - name: backend-app
          # Имя собранного локального образа бэкенда
          image: me4takrad/fastapi-backend:latest
          # Настройка политики скачивания образа (Never заставляет брать локальный образ)
          imagePullPolicy: Always
          # Переменные окружения для работы FastAPI приложения
          env:
            # Передаем строку подключения к БД с использованием DNS-имени сервиса db
            - name: DATABASE_URL
              # Ссылка на подключение к базе данных PostgreSQL
              value: postgresql://postgres_user:postgres_password@db:5432/main_application_db
          # Список открываемых сетевых портов контейнером бэкенда
          ports:
            # Описание порта веб-сервера Uvicorn
            - containerPort: 8000
              # Сетевое имя порта внутри кластера
              name: backport

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Версия API Kubernetes для сетевых служб
apiVersion: v1
# Определяем тип создаваемого объекта как Service для бэкенда
kind: Service
# Метаданные сетевой службы бэкенда
metadata:
  # Уникальное внутреннее DNS-имя службы бэкенда (backend:8000)
  name: backend
# Спецификация конфигурации сетевого сервиса бэкенда
spec:
  # Список портов службы
  ports:
    # Описание сетевого порта службы
    - port: 8000
      # Целевой порт контейнера FastAPI бэкенда
      targetPort: 8000
  # Селектор для перенаправления запросов на поды бэкенда
  selector:
    # Направлять весь входящий трафик на поды с меткой app: backend
    app: backend
  # Внутренний тип сетевого сервиса кластера
  type: ClusterIP

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Указываем версию API для создания контроллеров развертывания
apiVersion: apps/v1
# Определяем тип создаваемого объекта как Deployment для запуска React фронтенда
kind: Deployment
# Метаданные развертывания фронтенда
metadata:
  # ИСПРАВЛЕНО: Убираем лишнее двоеточие для корректного парсинга YAML
  name: frontend
# Спецификация желаемого состояния развертывания фронтенда
spec:
  # Количество реплик фронтенда
  replicas: 1
  # Селектор привязки к подам фронтенда
  selector:
    # Шаблон поиска подов по меткам
    matchLabels:
      # Поды с меткой app: frontend будут управляться этим развертыванием
      app: frontend
  # Шаблон создания подов фронтенда
  template:
    # Метаданные создаваемых подов фронтенда
    metadata:
      # Метки создаваемого пода
      labels:
        # Метка приложения, идентифицирующая под фронтенда
        app: frontend
    # Спецификация контейнеров внутри пода фронтенда
    spec:
      # Список запускаемых контейнеров (один контейнер раздачи React)
      containers:
        # Имя контейнера внутри пода
        - name: frontend-app
          # Имя собранного локального образа фронтенда (из твоей папки frontend)
          image: me4takrad/react-frontend:latest
          # Указываем брать локальный образ из реестра Docker Desktop без попыток скачать его
          imagePullPolicy: Always
          # Открываемый порт контейнера Nginx, раздающего статику фронтенда
          ports:
            # Описание стандартного HTTP-порта фронтенда
            - containerPort: 80
              # Сетевое имя порта внутри кластера
              name: frontport

# Разделитель нескольких документов в рамках одного YAML-файла
---

# Версия API Kubernetes для сетевых служб
apiVersion: v1
# Определяем тип создаваемого объекта как Service для фронтенда
kind: Service
# Метаданные сетевой службы фронтенда
metadata:
  # Уникальное внутреннее DNS-имя службы фронтенда (frontend:80)
  name: frontend
# Спецификация конфигурации сетевого сервиса фронтенда
spec:
  # Список портов службы
  ports:
    # Описание порта сетевой службы
    - port: 80
      # Целевой порт контейнера фронтенда
      targetPort: 80
  # Селектор для перенаправления запросов на поды фронтенда
  selector:
    # Направлять весь трафик на поды с меткой app: frontend
    app: frontend
  # Внутренний тип сетевого сервиса кластера
  type: ClusterIP