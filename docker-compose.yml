# Указание версии спецификации формата файла Docker Compose
# version: '3.8'

# Объявление списка объединяемых виртуальных сервисов
services:
  # Служба системы управления базами данных PostgreSQL
  db:
    # Указание официального дистрибутива PostgreSQL версии 18
    image: postgres:18
    # Назначение уникального имени контейнеру базы данных
    container_name: postgres-db
    # Настройка автоматической перезагрузки при аварийном завершении
    restart: always
    # Объявление списка переменных окружения для настройки СУБД
    environment:
      # Указываем вложенный каталог для данных базы
      PGDATA: /var/lib/postgresql/data/pgdata
      # Имя пользователя администратора базы данных
      POSTGRES_USER: postgres_user
      # Пароль для аутентификации администратора
      POSTGRES_PASSWORD: postgres_password
      # Название автоматически создаваемой базы данных
      POSTGRES_DB: main_application_db
    # Проброс порта сервера базы данных на хост-систему
    ports:
      # Связывание стандартного порта PostgreSQL
      - "5432:5432"
    # Подключение именованных томов и файлов инициализации
    volumes:
      # Связываем том с корневой директорией СУБД в контейнере
      - pgdata:/var/lib/postgresql
      # Монтирование файла с первичной структурой таблиц
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  
  
  # Описание сервиса бэкенда на базе FastAPI
  backend:
    # Указание пути к директории сборки образа бэкенда
    build: ./api/app
    # Назначение имени создаваемому контейнеру бэкенда
    container_name: fastapi-backend
    command: sh -c "mkdir -p /app/static/images && uvicorn main:app --host 0.0.0.0 --port 8000"
    # Связывание порта 8000 хост-системы с портом 8000 контейнера
    ports:
      - "8000:8000"
    # Подключение локальных папок с жесткого диска хоста
    volumes:
      # Монтирование локальной папки с картинками в папку внутри контейнера бэкенда
      - ./api/static:/static
    # Передача переменных окружения с параметрами подключения
    environment:
      # Указание сетевого адреса подключения к СУБД через имя контейнера db
      DATABASE_URL: postgresql://postgres_user:postgres_password@db:5432/main_application_db
    # Определение зависимости запуска от готовности базы данных
    depends_on:
      # Ожидание старта контейнера СУБД
      - db

  # Описание сервиса фронтенда на базе React и Nginx
  frontend:
    # Указание пути к директории сборки образа фронтенда
    build: ./frontend
    # Назначение имени создаваемому контейнеру фронтенда
    container_name: react-frontend
    # Связывание порта 8080 хост-системы с портом 80 контейнера Nginx
    ports:
      - "8080:80"
    # Задание зависимости запуска после успешного старта бэкенда
    depends_on:
      - backend

  redis:
    image: redis:8
    container_name: redis-cache
    ports:
      - "6379:6379"

# Объявление внешних именованных томов
volumes:
  # Создание изолированного виртуального диска для файлов базы данных
  pgdata: