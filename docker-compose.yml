# Указание версии спецификации формата файла Docker Compose
version: '3.8'

# Объявление списка объединяемых виртуальных сервисов
services:
  # Описание сервиса бэкенда на базе FastAPI
  backend:
    # Указание пути к директории сборки образа бэкенда
    build: ./api/app
    # Назначение имени создаваемому контейнеру бэкенда
    container_name: fastapi-backend
    # Связывание порта 8000 хост-системы с портом 8000 контейнера
    ports:
      - "8000:8000"

  # Описание сервиса фронтенда на базе React и Nginx
  frontend:
    # Указание пути к директории сборки образа фронтенда
    build: ./frontend
    # Назначение имени создаваемому контейнеру фронтенда
    container_name: react-frontend
    # Связывание порта 8080 хост-системы с портом 80 контейнера Nginx
    ports:
      - "8080:80"
    # Задание зависимости запуска после успешного старта бэкенда
    depends_on:
      - backend