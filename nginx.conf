# Задаем область обработки событий сетевых соединений в Nginx
events {
    # Устанавливаем предельное количество одновременно обслуживаемых соединений одним рабочим процессом
    worker_connections 1024;
}

# Открываем главный блок настройки протокола обработки гипертекста HTTP
http {
    # Включаем автоматическое определение MIME-типов передаваемых файлов
    include /etc/nginx/mime.types;
    # Задаем базовый тип содержимого по умолчанию для неизвестных файлов
    default_type application/octet-stream;
    
    # Настраиваем виртуальный сервер для перехвата незащищенного HTTP-трафика
    server {
        # Указываем сетевому модулю слушать входящие запросы на порту 80
        listen 80;
        # Задаем доменное имя локального узла для сопоставления с заголовком Host
        server_name localhost;

        # Устанавливаем правила обработки для всех входящих путей запроса
        location / {
            # Отправляем клиенту код перенаправления 301 с переадресацией на защищенную схему HTTPS
            return 301 https://$host$request_uri;
        }
    }

    # Настраиваем виртуальный сервер для обработки защищенного TLS-трафика
    server {
        # Указываем сетевому модулю слушать порт 443 с активацией криптографического модуля SSL
        listen 443 ssl;
        # Задаем доменное имя локального узла для защищенного соединения
        server_name localhost;

        # Задаем абсолютный путь к файлу публичного SSL-сертификата внутри контейнера
        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        # Задаем абсолютный путь к файлу закрытого ключа шифрования внутри контейнера
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Указываем разрешенные версии криптографических протоколов защищенного соединения
        ssl_protocols TLSv1.2 TLSv1.3;

        # Настраиваем перенаправление сетевых запросов к внутренней службе бэкенда
        location /api/ {
            # Пересылка входящего HTTP-запроса на контейнер приложения с отсечением пути /api/
            proxy_pass http://backend:8000/;
            # Запись оригинального сетевого имени узла в заголовок проксирования
            proxy_set_header Host $host;
            # Передача реального сетевого адреса клиента в заголовок проксирования
            proxy_set_header X-Real-IP $remote_addr;
            # Формируем список промежуточных IP-адресов в заголовке X-Forwarded-For
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Передаем исходную схему соединения https во внутреннем заголовке X-Forwarded-Proto
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Настраиваем перенаправление для статических изображений бэкенда
        location /static/ {
            # # Передаем запрос статических файлов на внутренний сервер приложений backend
            # proxy_pass http://backend:8000/static/;
            # # Передаем оригинальный заголовок Host
            # proxy_set_header Host $host;
            alias /app/static/;
        }

        # Настраиваем перенаправление всех остальных запросов на клиентское приложение React
        location / {
            # Передаем зашифрованный и расшифрованный запрос на внутренний веб-сервер frontend
            proxy_pass http://frontend:80;
            # Сохраняем и передаем оригинальный заголовок Host от клиента
            proxy_set_header Host $host;
            # Передаем реальный IP-адрес клиента во внутреннем заголовке X-Real-IP
            proxy_set_header X-Real-IP $remote_addr;
            # Формируем список промежуточных IP-адресов в заголовке X-Forwarded-For
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Передаем исходную схему соединения https во внутреннем заголовке X-Forwarded-Proto
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }   
}